<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خالد | Leon STORE Profile</title>
  <style>
    :root {
      --bg-color: #080b10;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border-color: hsl(var(--hue) 90% 60% / 0.2);
      --accent-blue: hsl(var(--hue) 90% 60%);
      --accent-purple: hsl(calc(var(--hue) + 60) 90% 65%);
      --accent-pink: hsl(calc(var(--hue) + 140) 90% 62%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, hsl(var(--hue) 90% 60% / 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, hsl(var(--hue) 90% 60% / 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, hsl(var(--hue) 90% 60% / 0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      perspective: 1000px;
    }

    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px hsl(var(--hue) 90% 60% / 0.1);
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .avatar-wrapper {
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
      position: relative;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
      padding: 3px;
      box-shadow: 0 0 25px hsl(var(--hue) 90% 60% / 0.5);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      background: #0f172a;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }

    .avatar-wrapper:hover .avatar-img {
      transform: scale(1.08);
    }

    .user-info {
      text-align: center;
      margin-bottom: 28px;
    }

    .user-name {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .user-tag {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-blue);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .user-bio {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 18px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .link-item:hover {
      background: hsl(var(--hue) 90% 60% / 0.12);
      border-color: hsl(var(--hue) 90% 60% / 0.4);
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .link-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .link-details {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    .link-title {
      font-size: 15px;
      font-weight: 700;
    }

    .link-user {
      font-size: 12px;
      color: var(--text-sub);
      direction: ltr;
      text-align: right;
    }

    .link-action {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      transition: all 0.2s;
    }

    .link-item:hover .link-action {
      background: var(--accent-blue);
      color: #0f172a;
    }

    .store .link-icon { color: var(--accent-blue); }
    .discord .link-icon { color: #818cf8; }
    .tiktok .link-icon { color: #f43f5e; }
    .instagram .link-icon { color: #e879f9; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent-blue);
      color: #0f172a;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @property --hue { syntax: '<number>'; inherits: true; initial-value: 160; }
    @property --angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    :root { animation: hueShift 10s linear infinite; }
    @keyframes hueShift { from { --hue: 160; } to { --hue: 520; } }
    @keyframes spin { to { --angle: 360deg; } }
    @keyframes shine { to { background-position: 200% center; } }
    @keyframes float { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.5); } }
    @keyframes gridMove { to { background-position: 40px 40px; } }
    .bg-glow { animation: float 6s ease-in-out infinite; }
    .bg-grid { animation: gridMove 4s linear infinite; }
    .avatar-wrapper { background: conic-gradient(from var(--angle), var(--accent-blue), var(--accent-purple), var(--accent-pink), var(--accent-blue)); animation: spin 3s linear infinite; box-shadow: 0 0 30px hsl(var(--hue) 90% 60% / 0.6); }
    .user-name { background: linear-gradient(90deg, #fff, var(--accent-blue), var(--accent-pink), #fff); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shine 4s linear infinite; }
    .user-tag { color: var(--accent-blue); }
    .profile-card { border-color: hsl(var(--hue) 90% 60% / 0.35); }
    .store .link-icon { width: 46px; height: 46px; }
    .store .link-icon .store-logo { width: 34px; height: 34px; fill: none; filter: drop-shadow(0 0 6px hsl(var(--hue) 90% 60% / 0.6)); transition: transform .4s; }
    .store:hover .store-logo { transform: rotate(60deg) scale(1.1); }
    .store .link-icon { width: 50px; height: 50px; padding: 0; overflow: hidden; border-radius: 50%; border-color: hsl(var(--hue) 90% 60% / 0.5); }
    .store-logo-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; transition: transform .4s; }
    .store:hover .store-logo-img { transform: rotate(360deg) scale(1.08); }
    .bg-grid, .bg-glow { display: none; }
    body { background-color: #000; }
    #bgCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .bg-vignette { display: none; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.95) 100%); }
  </style>
</head>

  <div class="toast" id="toast">تم نسخ يوزر الديسكورد!</div>

  <script>
    const card = document.getElementById('profileCard');
    const toast = document.getElementById('toast');

    document.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 30;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 30;
      card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });

    function copyDiscord(username) {
      navigator.clipboard.writeText(username).then(() => {
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      });
    }

    (function () {
      const cv = document.getElementById('bgCanvas');
      const ctx = cv.getContext('2d');
      let w, h, dpr, P = [];
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function make() {
        const a = Math.random() * Math.PI * 2;
        return {
          x: Math.random() * w, y: Math.random() * h,
          len: 2 + Math.random() * 5,
          ang: Math.random() * Math.PI,
          vx: (Math.random() - 0.5) * 0.35, vy: 0.1 + Math.random() * 0.45,
          spin: (Math.random() - 0.5) * 0.01,
          ph: Math.random() * 6.28, sp: 0.5 + Math.random() * 1.5,
          lw: Math.random() < 0.15 ? 2 : 1.2
        };
      }
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        cv.width = w * dpr; cv.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const n = Math.min(260, Math.round(w * h / 5500));
        P = Array.from({ length: n }, make);
      }
      resize();
      window.addEventListener('resize', resize);
      function draw(ms) {
        const t = ms / 1000;
        ctx.clearRect(0, 0, w, h);
        for (const p of P) {
          if (!reduce) {
            p.x += p.vx; p.y += p.vy; p.ang += p.spin;
            if (p.y > h + 10) { p.y = -10; p.x = Math.random() * w; }
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;
          }
          const a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * p.sp + p.ph));
          const dx = Math.cos(p.ang) * p.len / 2, dy = Math.sin(p.ang) * p.len / 2;
          ctx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
          ctx.lineWidth = p.lw;
          ctx.beginPath();
          ctx.moveTo(p.x - dx, p.y - dy);
          ctx.lineTo(p.x + dx, p.y + dy);
          ctx.stroke();
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();
  </script>
